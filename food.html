<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href="css/win95.css" rel="stylesheet" />
</head>
<style>
    body {
        margin-left: 30%;
        margin-right: 30%;
        margin-top: 6em;
    }
    #mydiv {
        position: absolute;
        z-index: 9;
    }
    #mydivheader {
        cursor: move;
        z-index: 10;
    }
    #modal2 {
        position: absolute;
        z-index: 11;
    }
    #mydivheader2 {
        cursor: move;
        z-index: 12;
    }
</style>
<body>
    
    <div class="container" id="mydiv">
        <div class="card mb-4">
            <div class="card-header" id="mydivheader">
                <h4 class="my-0 font-weight-normal">Pick a Restaurant</h4>
            </div>
            <div class="card-body" >
                
                <h5>Welcome to our state of the art Downtown Pittsburgh restaurant picker.</h5>
				
				
				<div class="form-group row">
                    <div class="col-sm-2">Weather:</div>
                    <div class="col-sm-10">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="gridCheck1">
                            <label class="form-check-label" for="gridCheck1">
                                Extreme
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
				<button type="button" style="width:20%; margin-left: 80%" class="btn btn-md btn-outline-primary" onclick="chooseRestaurant();">Choose Restaurant</button>
            </div>
        </div>
        </div>

        <div class="modal fade show mydiv2" id="modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" style="display: none; padding-right: 12px; margin-top: 0em;" aria-modal="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content" id="modal2">
                    <div class="modal-header" id="mydivheader2">
                        <h5 class="modal-title" id="exampleModalLabel">Chosen Restaurant</h5>
                        <button type="button" onclick="closeModal();" class="btn" aria-label="Close">
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <img src="images/sparkles.gif" class="img-fluid">
                        <h5 style="color:black;">Your chosen restaurant is: <span id="restaurantOutput"></span>!</h5>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-dismiss="modal" onclick="chooseRestaurant();">Reroll</button>
                    </div>
                </div>
            </div>
        </div>
    
    </div>
  
   <footer style="width: 100%; background-color: silver; height: 3%; position: fixed; left: 0px; bottom: 0px; padding-top: 4px;"> 
        <div class="row" style="position: relative; left: 20px;">
            <div>
                <a class="btn start-button" style="color:black;" ><img src="images/directory_open_cool-4.png" class="icon-16">Restaurant Picker</a>
            </div>
    </footer>

    
</body>
<script>
    function closeModal() {
        let modal = document.getElementById("modal");
        modal.style.display="none";
    }
    
    function chooseRestaurant() {
        let modal = document.getElementById("modal");
        modal.style.display="block";

        let weather = document.getElementById("gridCheck1");

        let number = Math.floor(Math.random() * 375);
        let choice = "";

    if (weather.checked != true) {

    if (number < 8) {
        choice = "Chipotle";
    }
    else if (number < 19) {
        choice = "Jimmy Johns";
    }
    else if (number < 40) {
        choice = "Yuzu Kitchen";
    }
    else if (number < 131) {
        choice = "Gyro Food Truck";
    }
    else if (number < 157) {
        choice = "Arepitta";
    }
    else if (number < 178) {
        choice = "Weiner World";
    }
    else if (number < 229) {
        choice = "Apollo Cafe";
    }
    else if (number < 243) {
        choice = "Mad Chicken";
    }
    else if (number < 257) {
        choice = "Erin's Market";
    }
    else if (number < 278) {
        choice = "Hello Bistro";
    }
    else if (number < 296) {
        choice = "Forbes Tavern";
    }
    else if (number < 305) {
        choice = "Five Guys";
    }
    else if (number < 314) {
        choice = "Moes";
    }
    else if (number < 330) {
        choice = "Moonlit Burgers";
    }
    else if (number < 356) {
        choice = "No 1 Sushi";
    }
    else if (number < 375) {
        choice = "Noodles & Co";
    }
    }
    else {
        if (number < 20) {
        choice = "Cafeteria";
    }
    else if (number < 120) {
        choice = "Dungeon/Tunnel Restaurants";
    }
    else if (number < 200) {
        choice = "Jimmy Johns";
    }
    else if (number < 375) {
        choice = "Gyro Food Truck";
    }
    }
    let output = document.getElementById("restaurantOutput");
    output.innerText = choice;
    }

    dragElement(document.getElementById("mydiv"));
    dragElement(document.getElementById("modal2"));
function dragElement(elmnt) {
  var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  if (document.getElementById(elmnt.id + "header")) {
    // if present, the header is where you move the DIV from:
    document.getElementById(elmnt.id + "header").onmousedown = dragMouseDown;
  } else {
    // otherwise, move the DIV from anywhere inside the DIV:
    elmnt.onmousedown = dragMouseDown;
  }

  function dragMouseDown(e) {
    e = e || window.event;
    e.preventDefault();
    // get the mouse cursor position at startup:
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    // call a function whenever the cursor moves:
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    // calculate the new cursor position:
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    // set the element's new position:
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
  }

  function closeDragElement() {
    // stop moving when mouse button is released:
    document.onmouseup = null;
    document.onmousemove = null;
  }
}

</script>
</html>
