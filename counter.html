<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body class="bg-light">

      <ul class="nav nav-tabs mx-auto">
        <li class="nav-item">
            <a href="/" class="nav-link">Home</a>
          </li>
        <li class="nav-item">
            <a href="resume" class="nav-link">Resume</a>
        </li>
        <li class="nav-item">
            <a href="contact" class="nav-link">Contact</a>
        </li>
        <li class="nav-item active">
            <a href="counter" class="nav-link active">Counter</a>
        </li>
      </ul>

    <div class="container">
        <br>
        <div class="d-flex align-items-center justify-content-center">
        <h1 class="text-dark mx-auto">Counter</h1>
    </div>
    </div>
    <div class="container">
        <button id="counterButton" class="btn btn-primary">Count Up!</button>
        <button id="reset" class="btn btn-primary">Reset</button>
        <ol id="output"></ol>
    </div>
    <div class="lines2">
        <hr>
        <hr>
        <hr>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
        function addTime(){
            let output = document.getElementById("output");
            let timestamp = document.createElement("li");
            timestamp.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: "2-digit", hour12: true });
            output.appendChild(timestamp);
            localStorage.setItem("list", output.innerHTML);
        };
        function loadTimers(){
            if (localStorage.getItem("list") != null) {
                let output = document.getElementById("output");
                let list = localStorage.getItem("list");
                output.innerHTML = list;
            }
        }
        function reset(){
            if(confirm("Are you sure you want to clear the times?")){
            let output = document.getElementById("output");
            output.innerHTML = "";
            localStorage.clear();
            }
        }
        document.getElementById("counterButton").addEventListener("click", addTime);
        document.getElementById("reset").addEventListener("click", reset);
        loadTimers();
    </script>
  </body>
</html>
