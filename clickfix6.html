<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Code Editor with Copy Button</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --header-bg: #2d2d2d;
            --text-color: #d4d4d4;
            --btn-bg: #3c3c3c;
            --btn-hover: #4e4e4e;
            --btn-text: #ffffff;
            --font-family: 'Courier New', Courier, monospace;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .code-container {
            max-width: 600px;
            margin: 0 auto;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: var(--bg-color);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background-color: var(--header-bg);
            color: #aaa;
            font-size: 0.85rem;
        }

        .copy-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s ease;
        }

        .copy-btn:hover {
            background-color: var(--btn-hover);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        /* Using a textarea allows full text manipulation, selection, and typing */
        .code-textarea {
            width: 100%;
            height: 200px;
            padding: 16px;
            border: none;
            resize: vertical;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: 0.95rem;
            line-height: 1.5;
            outline: none;
            box-sizing: border-box;
            display: block;
        }
    </style>
</head>
<body>

    <div class="code-container">
        <div class="code-header">
            <span>Editor</span>
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
        </div>
        <textarea id="code-editor" class="code-textarea" spellcheck="false"></textarea>
    </div>

    <script>
        function copyCode(button) {
            const codeEditor = document.getElementById('code-editor');
            const codeText = codeEditor.value;
            
            navigator.clipboard.writeText(codeText).then(() => {
                button.textContent = 'Copied!';
                button.style.backgroundColor = '#28a745';
                
                setTimeout(() => {
                    button.textContent = 'Copy';
                    button.style.backgroundColor = '';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy code block.');
            });
        }
    </script>

</body>
</html>
